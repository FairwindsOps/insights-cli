apiVersion: kyverno.io/v2
kind: Policy
metadata:
  annotations:
    example.com/image: '!*:latest'
    example.com/pattern: ?*
    example.com/template: Pod {{ request.object.metadata.name }} must set app
    policies.kyverno.io/description: |-
      Requires labels.
      Second line with a # hash
    policies.kyverno.io/title: 'Edge: values that must stay strings'
  finalizers:
    - kyverno.io/finalizer
  generateName: edge-
  labels:
    app: security
    empty: ""
    flag: "yes"
    "off": "no"
    quoted-false: "false"
    switch: "on"
    tier: "1"
  name: edge-policy
  namespace: production
spec:
  background: true
  rules:
    - cel:
        expressions:
          - expression: |
              has(object.metadata.annotations) &&
              ("app.kubernetes.io/name" in object.metadata.annotations) &&
              object.spec.replicas > 0
            message: Deployment must have app.kubernetes.io/name
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
                - staging
      name: check-edge
      validate:
        message: 'Image tag should be specified: not latest'
        pattern:
          spec:
            containers:
              - image: registry.company.com/*
                name: '*'
                securityContext:
                  privileged: "false"
                  runAsNonRoot: true
            progressDeadlineSeconds: 600
            ratio: 1.5
            replicas: 2
  schemaValidation: false
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 10
status:
  message: ""
  ready: true
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: Enforces image security requirements and approved registries
    policies.kyverno.io/severity: high
    policies.kyverno.io/title: Image Security Policy
  labels:
    app: security
    env: production
    tier: image
  name: image-security-policy
spec:
  background: true
  rules:
    - match:
        resources:
          kinds:
            - Pod
      name: require-approved-registry
      validate:
        message: Images must come from approved registries
        pattern:
          spec:
            containers:
              - image: registry.company.com/*
    - match:
        resources:
          kinds:
            - Pod
      name: disallow-latest-tag
      validate:
        message: Images must not use the 'latest' tag
        pattern:
          spec:
            containers:
              - image: '!*:latest'
  validationFailureAction: Enforce
status:
  ready: true
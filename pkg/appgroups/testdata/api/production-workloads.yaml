name: production-workloads
spec:
    exclude:
        - kinds:
            - Pod
            - Deployment
            - StatefulSet
            - Service
          namespaces:
            - kube-system
            - kube-public
            - kube-node-lease
          labels:
            - app: system
    match:
        - clusters:
            - us-east-1
            - us-west-2
          kinds:
            - Pod
            - Deployment
            - StatefulSet
            - Service
          namespaces:
            - production
            - prod-*
          labels:
            - env: production
            - tier: production

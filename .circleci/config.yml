## DO NOT EDIT - Managed by Terraform
version: 2.1

orbs:
  rok8s: fairwinds/rok8s-scripts@17.0.0
  slack: circleci/slack@6.1.3

references:
  install_vault_machine: &install_vault_machine
    run:
      name: install hashicorp vault
      command: |
        sudo apt-get update -y && sudo apt-get install -y curl unzip
        cd /tmp
        curl -LO https://releases.hashicorp.com/vault/1.21.4/vault_1.21.4_linux_amd64.zip
        echo '889b681990fe221b884b7932fa9c9dd0ee9811b9349554f1aa287ab63c9f3dae  vault_1.21.4_linux_amd64.zip' | sha256sum -c
        unzip -o vault_1.21.4_linux_amd64.zip
        sudo mv vault /usr/bin/vault
  setup_qemu_binfmt: &setup_qemu_binfmt
    run:
      name: Setup QEMU for multi-arch Docker builds
      command: |
        sudo apt-get update -y
        sudo apt-get install -y qemu-user-static binfmt-support
        docker buildx create --use || true
        docker buildx inspect --bootstrap

jobs:
  test:
    docker:
      - image: cimg/go:1.27.1
    steps:
      - checkout
      - run:
          name: Go Mod Download
          command: go mod download && go mod verify
      - run:
          name: golangci-lint
          command: |
            curl -fsSL -o golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz
            echo '2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6  golangci-lint.tar.gz' | sha256sum -c
            tar -xzf golangci-lint.tar.gz
            mv golangci-lint-2.13.2-linux-amd64/golangci-lint "$(go env GOPATH)/bin/golangci-lint"
            golangci-lint run --timeout 5m
      - run:
          name: test
          command: |
            go test -v -coverprofile=coverage.txt -covermode=atomic ./...
            go vet ./...
      - run:
          name: e2e setup
          command: .circleci/scripts/e2e-env.sh
      - *install_vault_machine
      - rok8s/get_vault_env:
          vault_path: repo/insights-cli/env
      - run:
          name: e2e tests
          command: go test -v -tags e2e ./...
  snapshot:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - *setup_qemu_binfmt
      - run:
          name: Run GoReleaser snapshot
          command: |
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$(pwd):/workspace" -w /workspace \
              -e CIRCLE_SHA1 \
              -e CIRCLE_BRANCH \
              -e CIRCLE_TAG \
              goreleaser/goreleaser:v2.18.1 release --snapshot --skip=sign
      - store_artifacts:
          path: dist
          destination: snapshot
  release:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    shell: /bin/bash
    steps:
      - checkout
      - *install_vault_machine
      - rok8s/get_vault_env:
          vault_path: repo/global/env
      - rok8s/get_vault_env:
          vault_path: repo/insights-cli/env
      - run:
          name: docker login Google Artifact Registry
          command: |
            echo "$GCP_ARTIFACTREADWRITE_JSON_KEY" | base64 -d | docker login -u _json_key --password-stdin us-docker.pkg.dev
      - *setup_qemu_binfmt
      - run:
          name: Run GoReleaser release
          command: |
            export GORELEASER_CURRENT_TAG="${CIRCLE_TAG}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$(pwd):/workspace" -w /workspace \
              -v "${HOME}/.docker:/root/.docker" \
              -e GORELEASER_CURRENT_TAG \
              -e CIRCLE_TAG \
              -e CIRCLE_SHA1 \
              -e GO111MODULE=on \
              -e GITHUB_TOKEN \
              -e VAULT_ADDR \
              -e VAULT_TOKEN \
              goreleaser/goreleaser:v2.18.1 release
  scan_for_vulnerabilities:
    docker:
      - image: cimg/go:1.27.1
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - *install_vault_machine
      - rok8s/get_vault_env:
          vault_path: repo/global/env
      - rok8s/get_vault_env:
          vault_path: repo/insights-cli/env
      - run:
          name: docker login Google Artifact Registry
          command: |
            echo "$GCP_ARTIFACTREADWRITE_JSON_KEY" | base64 -d | docker login -u _json_key --password-stdin us-docker.pkg.dev || true
      - run: ./.circleci/scripts/install-trivy.sh
      - run:
          name: Scan tip image
          command: ./.circleci/scripts/scan-vulnerabilities.sh
      - store_artifacts:
          path: trivy-fs-table.txt
          when: always
      - slack/notify:
          event: fail
          channel: CPYBX810T
          branch_pattern: main
          custom: |
            {
                "text": "insights-cli: CRITICAL vulnerabilities",
                "blocks": [
                    {
                        "type": "section",
                        "text": {
                            "type": "mrkdwn",
                            "text": "insights-cli: CRITICAL vulnerabilities\n\n$CRITICAL_VULNERABILITIES_LIST\n\n$CIRCLE_BUILD_URL"
                        }
                    }
                ]
            }

workflows:
  version: 2
  test_and_build:
    when: pipeline.trigger_source != "scheduled_pipeline"
    jobs:
      - test:
          filters:
            tags:
              ignore: /.*/
          context: org-global
      - snapshot:
          requires:
            - test
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
  release:
    when: pipeline.trigger_source != "scheduled_pipeline"
    jobs:
      - test:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /v.*/
          context: org-global
      - release:
          requires:
            - test
          context: org-global
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /v.*/

  # Driven by a CircleCI Schedule Trigger named "check_vulnerabilities" on main,
  # ~12:00 UTC, created under Project Settings > Triggers.
  check_vulnerabilities:
    when: pipeline.trigger_source == "scheduled_pipeline" and pipeline.schedule.name == "check_vulnerabilities"
    jobs:
      - scan_for_vulnerabilities:
          context: org-global
